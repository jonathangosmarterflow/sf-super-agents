<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Joe's Heating and Air (demo): your AI shop galaxy, HVAC Foundry</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="galaxy-favicon.svg">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* HVAC Foundry tokens (brand/hvac-foundry/brand.md), dark stage */
:root{
  --hf-navy:#0B2545; --hf-deep:#071A33; --hf-ink:#0E1B2C;
  --hf-blue:#1D5FA8; --hf-blue-dk:#13477F; --hf-sky:#8EC5E8;
  --hf-ice:#DCEBF7; --hf-ice-2:#EEF5FB; --hf-white:#FFFFFF;
  --hf-muted-dk:#A9BCD1; --hf-copper:#B4541A; --hf-copper-dk:#9A4514; --hf-amber:#E08A3C;
  --hf-head:'Archivo','Helvetica Neue',Arial,sans-serif;
  --hf-body:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;
  --hf-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --space:#040C1A; --glass:rgba(7,26,51,.80); --glass2:rgba(142,197,232,.06); --hair:rgba(142,197,232,.18);
  --txt:#fff; --txt2:#DCEBF7; --txt3:#A9BCD1;
  --panel-w:400px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--space);color:var(--txt);font-family:var(--hf-body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
#scene{position:fixed;inset:0}
#scene canvas{display:block;outline:none}
.mono{font-family:var(--hf-mono);font-weight:500;text-transform:uppercase;letter-spacing:.12em}

/* top left: wordmark + breadcrumb */
#top{position:fixed;left:20px;top:16px;z-index:5;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:calc(100vw - 40px)}
#top > *{pointer-events:auto}
.hf-wordmark{display:inline-flex;align-items:center;gap:10px;font-family:var(--hf-head);text-transform:uppercase;letter-spacing:.12em;font-size:15px;color:#fff}
.hf-wordmark svg{width:30px;height:30px}
.hf-wordmark span{font-weight:500;color:var(--hf-sky)}
.hf-wordmark b{font-weight:800}
.hf-wordmark em{font-style:normal;font-family:var(--hf-mono);font-weight:500;font-size:11px;color:var(--txt3);letter-spacing:.12em;margin-left:8px;padding-left:12px;border-left:1px solid var(--hair)}
#crumb{display:flex;flex-wrap:wrap;align-items:center;gap:4px;background:var(--glass);border:1px solid var(--hair);border-radius:10px;padding:6px 8px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);width:max-content;max-width:100%}
#crumb button{border:0;background:transparent;color:var(--txt3);font-family:var(--hf-mono);font-weight:500;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;padding:4px 6px;border-radius:6px;cursor:pointer}
#crumb button:hover{color:#fff;background:var(--glass2)}
#crumb button[aria-current="true"]{color:#fff}
#crumb .sep{color:var(--hf-blue);font-size:12px}
#crumb .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}

/* top right chips */
#chips{position:fixed;right:20px;top:16px;z-index:5;display:flex;gap:8px;align-items:center;transition:right .45s cubic-bezier(.2,.7,.2,1)}
.chip{font-family:var(--hf-mono);font-weight:500;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--hair);background:var(--glass);color:var(--txt3);padding:7px 10px;border-radius:6px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-decoration:none;white-space:nowrap}
.chip.demo{color:var(--hf-amber);border-color:rgba(224,138,60,.4)}
a.chip:hover{color:#fff;border-color:rgba(142,197,232,.45)}

/* tooltip */
#tip{position:fixed;z-index:8;pointer-events:none;background:rgba(7,26,51,.94);border:1px solid var(--hair);border-radius:10px;padding:9px 12px;max-width:280px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#tip b{display:block;font-family:var(--hf-head);font-weight:700;font-size:14px;letter-spacing:-.01em;color:#fff}
#tip span{display:block;font-size:12.5px;line-height:1.45;color:var(--txt2);margin-top:3px}
#tip i{display:inline-block;font-style:normal;margin-top:6px;font-family:var(--hf-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3)}

/* legend */
#legend{position:fixed;left:20px;bottom:18px;z-index:5;background:var(--glass);border:1px solid var(--hair);border-radius:10px;padding:12px 14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:grid;grid-template-columns:auto auto;gap:7px 18px;font-size:12.5px;color:var(--txt2);max-width:340px}
#legend h4{grid-column:1/-1;margin:0 0 2px;font-family:var(--hf-mono);font-weight:500;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--txt3)}
#legend div{display:flex;align-items:center;gap:8px;white-space:nowrap}
#legend p{grid-column:1/-1;margin:2px 0 0;padding-top:7px;border-top:1px solid var(--hair);font-size:11.5px;line-height:1.45;color:var(--txt3)}
.lg{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.lg.live{background:#fff;box-shadow:0 0 0 2px rgba(142,197,232,.35),0 0 10px 3px rgba(142,197,232,.75)}
.lg.available{background:var(--hf-sky);box-shadow:0 0 6px 1px rgba(142,197,232,.45)}
.lg.coming{background:rgba(142,197,232,.32)}
.lg.concept{background:transparent;border:1.5px solid rgba(220,235,247,.75)}

/* bottom right controls */
#ctl{position:fixed;right:20px;bottom:18px;z-index:5;display:flex;gap:8px;align-items:center;transition:right .45s cubic-bezier(.2,.7,.2,1)}
#ctl button{height:38px;padding:0 16px;border-radius:10px;border:1px solid rgba(142,197,232,.45);background:var(--glass);color:#fff;font-weight:600;font-size:13.5px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#ctl button:hover{background:rgba(29,95,168,.45)}
#ctl button.key{width:38px;padding:0;font-family:var(--hf-mono);font-size:12px;color:var(--txt3)}
#ctl button[aria-pressed="true"]{background:var(--hf-blue);border-color:var(--hf-blue)}

/* hint + toast */
#hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:4;font-size:12.5px;color:var(--txt3);background:rgba(7,26,51,.6);border:1px solid var(--hair);border-radius:10px;padding:8px 14px;white-space:nowrap;transition:opacity 1.2s;pointer-events:none}
#hint.gone{opacity:0}
#toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-8px);z-index:9;font-family:var(--hf-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--txt2);background:var(--glass);border:1px solid var(--hair);border-radius:8px;padding:8px 12px;opacity:0;transition:opacity .5s,transform .5s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* tour caption */
#tourCap{position:fixed;left:50%;bottom:22px;transform:translate(-50%,10px);z-index:6;width:min(520px,calc(100vw - 40px));background:var(--glass);border:1px solid var(--hair);border-radius:10px;padding:14px 18px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:opacity .9s,transform .9s}
#tourCap.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#tourCap .eb{font-family:var(--hf-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--hf-sky);display:flex;justify-content:space-between;gap:12px}
#tourCap .eb small{color:var(--txt3);font-size:10.5px}
#tourCap h3{margin:6px 0 4px;font-family:var(--hf-head);font-weight:800;font-size:22px;letter-spacing:-.02em}
#tourCap p{margin:0;font-size:14px;line-height:1.5;color:var(--txt2)}
#tourCap .ct{margin-top:8px;font-size:12px;color:var(--txt3)}
body.touring #hint{opacity:0}

/* panel (same content model as the flat map) */
#panel{position:fixed;top:0;right:0;bottom:0;width:var(--panel-w);z-index:7;background:linear-gradient(170deg,rgba(11,37,69,.95),rgba(7,26,51,.97));border-left:1px solid var(--hair);transform:translateX(102%);transition:transform .55s cubic-bezier(.2,.7,.2,1);overflow-y:auto;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#panel.open{transform:none}
body.panel-open #chips,body.panel-open #ctl{right:calc(var(--panel-w) + 20px)}
.ph{position:relative;padding:20px 20px 14px;border-bottom:1px solid var(--hair)}
.ph .crumb{display:flex;align-items:center;gap:8px;padding-right:130px;flex-wrap:wrap;font-family:var(--hf-mono);font-size:10.5px;color:var(--txt3);letter-spacing:.12em;text-transform:uppercase}
.ph .dp{width:9px;height:9px;border-radius:50%;display:inline-block}
.ph h2{margin:10px 0 4px;font-family:var(--hf-head);font-weight:800;font-size:22px;letter-spacing:-.02em;line-height:1.15}
.ph .fc{color:var(--hf-sky);font-weight:600;font-size:14px}
.ph .say{font-size:11.5px;color:var(--txt3);margin-top:2px}
.ver{font-size:11.5px;color:var(--txt3);margin-top:8px}
.ctx{font-size:11px;color:var(--txt3);margin-top:3px;font-variant-numeric:tabular-nums}
.copy{position:absolute;right:56px;top:16px;height:30px;padding:0 10px;border-radius:6px;border:1px solid var(--hair);background:var(--glass2);color:var(--txt2);cursor:pointer;font-size:11.5px;font-weight:600}
.copy:hover{color:#fff;border-color:rgba(142,197,232,.45)}
.x{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:8px;border:1px solid var(--hair);background:var(--glass2);color:#fff;cursor:pointer;font-size:18px;line-height:1}
.state{display:inline-flex;align-items:center;gap:7px;margin-top:9px;padding:5px 10px;border-radius:6px;font-size:12px;font-weight:600;border:1px solid var(--hair);background:var(--glass2);color:var(--txt2)}
.state i{width:7px;height:7px;border-radius:50%;display:inline-block}
.state.ok{border-color:rgba(142,197,232,.5);color:var(--hf-sky)}.state.ok i{background:var(--hf-sky)}
.state.wait{border-color:rgba(224,138,60,.5);color:var(--hf-amber)}.state.wait i{background:var(--hf-amber)}
.state.bad{border-color:rgba(255,140,120,.5);color:#ffb3a3}.state.bad i{background:#ff8a73}
.state.unk{color:var(--txt2)}.state.unk i{background:var(--txt3)}
.state.draft{border-style:dashed;color:var(--txt3)}.state.draft i{background:transparent;border:1px dashed var(--txt3)}
.pb{padding:16px 20px 28px;display:flex;flex-direction:column;gap:14px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:6px;font-size:12px;font-weight:600;border:1px solid var(--hair);background:var(--glass2);color:var(--txt2);width:max-content;max-width:100%}
.pill i{width:7px;height:7px;border-radius:50%;display:inline-block}
.pill.live{border-color:rgba(142,197,232,.55);color:#fff}
.pill.available{border-color:rgba(142,197,232,.45);color:var(--hf-sky)}
.pill.coming,.pill.concept{border-style:dashed;color:var(--txt3)}
.pill.demo{background:rgba(224,138,60,.1);border-color:rgba(224,138,60,.45);color:var(--hf-amber)}
.job{font-size:15px;line-height:1.55;color:#fff;margin:0}
.pain{border-left:3px solid var(--hf-amber);padding:8px 12px;color:var(--txt2);font-size:14px;line-height:1.5;background:rgba(224,138,60,.06);border-radius:0 8px 8px 0;font-style:italic}
.tabs{display:flex;gap:4px;background:var(--glass2);border:1px solid var(--hair);border-radius:10px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;color:var(--txt3);padding:8px 4px;border-radius:7px;font-weight:600;font-size:12px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:rgba(142,197,232,.16);color:#fff}
.rec h5{margin:14px 0 6px;font-family:var(--hf-mono);font-weight:500;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--txt3)}
.rec h5:first-child{margin-top:4px}
.rec p,.rec li{font-size:13.5px;line-height:1.55;color:#fff;margin:0}
.rec ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.rec .chips{display:flex;flex-wrap:wrap;gap:6px}
.rec .chips span{font-size:12px;padding:4px 9px;border-radius:6px;background:var(--glass2);border:1px solid var(--hair);color:var(--txt2)}
.rec .log{font-size:12.5px;color:var(--txt2);display:flex;flex-direction:column;gap:4px}
.rec .log time{color:var(--txt3);margin-right:6px;font-variant-numeric:tabular-nums}
.rec .acts2{display:flex;flex-direction:column;gap:6px}
.rec .acts2 div{font-size:13.5px;line-height:1.45;color:#fff}
.rec .acts2 small{display:block;color:var(--txt3);font-size:12px}
.rec details{margin-top:14px}
.rec summary{cursor:pointer;font-family:var(--hf-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--txt3);list-style:none}
.rec details p{color:var(--txt2);font-size:12.5px;margin-top:6px}
.rec .ev{display:inline-block;font-family:var(--hf-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--hf-amber);border:1px dashed rgba(224,138,60,.5);border-radius:6px;padding:3px 8px}
.card{background:var(--glass2);border:1px solid var(--hair);border-radius:10px;padding:12px 14px}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 14px;margin:0;font-size:13px}
.kv dt{color:var(--txt3)}.kv dd{margin:0;color:#fff;font-weight:600;text-align:right}
.scope{display:block;font-size:10.5px;font-weight:600;margin-top:2px;padding:1px 6px;border-radius:5px;width:max-content;margin-left:auto}
.scope.local{color:var(--hf-sky);border:1px solid rgba(142,197,232,.4)}
.scope.core{color:var(--txt2);border:1px solid var(--hair)}
.note{font-size:12.5px;color:var(--txt3);line-height:1.5;margin:0}
.dtag{display:inline-block;font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--hf-amber);border:1px solid rgba(224,138,60,.4);border-radius:5px;padding:1px 4px;margin-left:6px;vertical-align:middle}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--glass2);border:1px solid var(--hair);border-radius:10px;padding:10px}
.stat b{display:block;font-family:var(--hf-head);font-weight:800;font-size:22px;letter-spacing:-.02em;color:var(--hf-sky)}
.stat span{font-size:10.5px;color:var(--txt3);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.spark{display:flex;align-items:flex-end;gap:4px;height:46px;margin-top:8px}
.spark i{flex:1;background:linear-gradient(0deg,var(--hf-blue),var(--hf-sky));border-radius:2px 2px 0 0;opacity:.85}
.acts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.acts li{display:flex;gap:10px;font-size:13px;line-height:1.45;color:#fff}
.acts time{color:var(--txt3);font-size:12px;white-space:nowrap;min-width:62px;padding-top:2px;font-variant-numeric:tabular-nums}
.acts .ok{width:7px;height:7px;border-radius:50%;background:var(--hf-sky);flex:none;margin-top:7px}
.acts .ok.wait{background:var(--hf-amber)}
.grade-l{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;line-height:1.5;color:var(--txt2)}
.grade-l i{width:9px;height:9px;border-radius:50%;flex:none;margin-top:6px}
.cta{border-top:1px solid var(--hair);padding-top:14px}
.btn{display:block;text-align:center;border-radius:10px;padding:13px 14px;font-weight:600;font-size:14.5px;text-decoration:none;color:#fff;background:var(--hf-copper)}
.btn:hover{background:var(--hf-copper-dk)}
.dlist{display:flex;flex-direction:column;gap:6px}
.dlist button{display:flex;align-items:center;gap:10px;background:var(--glass2);border:1px solid var(--hair);border-radius:8px;padding:9px 12px;color:#fff;cursor:pointer;font-size:13.5px;text-align:left}
.dlist button:hover{border-color:rgba(142,197,232,.45)}
.dlist .st{width:9px;height:9px;border-radius:50%;flex:none}
.dlist .st.live{background:#fff;box-shadow:0 0 6px 1px rgba(142,197,232,.8)}
.dlist .st.available{background:var(--hf-sky)}
.dlist .st.coming{background:rgba(142,197,232,.32)}
.dlist .st.concept{border:1.5px solid rgba(220,235,247,.75)}
.dlist .g{margin-left:auto;font-size:11px;color:var(--txt3);font-weight:600;white-space:nowrap}
#foot{grid-column:1/-1;font-family:var(--hf-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(169,188,209,.6)}
body.panel-open #hint{opacity:0}
@media (max-width:1400px){body.panel-open #chips .chip.demo{display:none}}
@media (max-width:1100px){#hint{display:none}}

/* present mode: a clean stage for screen share */
body.present #legend,body.present #panel,body.present #hint,body.present #chips,body.present #ctl .key{display:none}
body.present #ctl{right:20px}
body.present #crumb{font-size:13px}

#fail{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:30px;text-align:center;background:var(--space);color:var(--txt2);font-size:15px;line-height:1.6}
#fail a{color:var(--hf-sky)}

@media (max-width:760px){
  :root{--panel-w:100vw}
  #panel{top:auto;height:62vh;border-left:0;border-top:1px solid var(--hair);border-radius:14px 14px 0 0;transform:translateY(104%)}
  #panel.open{transform:none}
  body.panel-open #chips,body.panel-open #ctl{right:20px}
  body.panel-open #ctl,body.panel-open #legend{opacity:0;pointer-events:none}
  #legend{grid-template-columns:auto;font-size:11.5px;padding:9px 11px;max-width:calc(100vw - 150px);gap:4px}
  #legend p{display:none}
  #chips .chip.demo{display:none}
  #hint,#foot{display:none}
  .hf-wordmark em{display:none}
  #ctl{bottom:18px}
}
@media (prefers-reduced-motion: reduce){
  #panel,#tourCap,#chips,#ctl,#toast{transition:none}
}
</style>
</head>
<body>
<div id="scene" aria-label="3D map of the shop's AI departments, agents and sub-systems"></div>

<header id="top">
  <span class="hf-wordmark"><svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="10" fill="#0B2545"/><rect x="3.5" y="3.5" width="41" height="41" rx="7" fill="none" stroke="#1D5FA8" stroke-width="1.25"/><rect x="14" y="12" width="6" height="24" rx="1" fill="#DCEBF7"/><rect x="14" y="12" width="21" height="6" rx="1" fill="#B4541A"/><rect x="14" y="21.5" width="15" height="5" rx="1" fill="#8EC5E8"/></svg><span>HVAC</span><b>FOUNDRY</b><em id="tenant"></em></span>
  <nav id="crumb" aria-label="Where you are"></nav>
</header>

<div id="chips"><span class="chip demo" id="demoChip"></span><a class="chip" href="index.html" title="Open the flat map">Flat map</a></div>

<div id="legend" aria-label="Legend">
  <h4>01 / Legend</h4>
  <div><i class="lg live"></i><span id="lgLive">Live</span></div>
  <div><i class="lg available"></i>Available to add</div>
  <div><i class="lg coming"></i>On the build list</div>
  <div><i class="lg concept"></i>Concept, not built</div>
  <p id="lgNote"></p>
  <div id="foot"></div>
</div>

<div id="ctl"><button class="key" id="presentBtn" title="Present mode (P)" aria-pressed="false">P</button><button id="tourBtn" aria-pressed="false">Tour</button></div>
<div id="hint">Drag to look around. Scroll to zoom. Click a department to fly in. Esc flies out. P presents.</div>
<div id="toast" role="status"></div>
<div id="tourCap" aria-live="polite"></div>
<div id="tip" role="tooltip"></div>
<aside id="panel" aria-live="polite"></aside>
<div id="fail"></div>

<script src="https://unpkg.com/3d-force-graph@1.80.1/dist/3d-force-graph.min.js"></script>
<script>
/* The force-graph bundle carries its own three.js r186; the page imports the same release (0.186.1) for its custom objects.
   Clearing the marker keeps the console free of the duplicate-instance warning (same version, no conflict). */
try { delete window.__THREE__; } catch (e) {}
</script>

  ctr.enableDamping = true; ctr.dampingFactor = .07; ctr.rotateSpeed = .45; ctr.zoomSpeed = .6; ctr.minDistance = 12; ctr.maxDistance = 2600;

  /* space: two starfield depths, a faint spiral disk, three nebula washes */

  const farStars = stars(2600, 2600, 3800, 16, .9, 'far');

  const disk = (() => {

  const nebulae = [['#1D5FA8', .1, V(-1300, 260, -1500)], ['#13477F', .14, V(1500, -200, -900)], ['#E08A3C', .035, V(400, 500, 1700)]].map(([c, o, p]) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX.glow, color: new THREE.Color(c), transparent: true, opacity: o, blending: THREE.AdditiveBlending, depthWrite: false, fog: false })); s.scale.set(2600, 2600, 1); s.position.copy(p); s.layers.set(1); scene.add(s); return s; });

  /* particles: flow toward the brain on every visible link, a sparser flow outward; degrade first on low fps */

  if (QS.get('q') === '0' || QS.get('q') === '1') { quality = +QS.get('q'); if (quality === 0) { nearStars.visible = false; graph.renderer().setPixelRatio(1); } }

  /* focus */

        else { if (x.id === dept) d = .25; else if (trail.has(x.id) || isDesc(x, focus)) d = 1; else if (x.agent === agent) d = .62; else if (x.dept === dept) d = .4; }

  }
  function camFor(id) {

    if (!g || g.layer === 0) { const az = Math.atan2(cam.position.z, cam.position.x), dist = overviewDist(), el = .38; return { pos: V(Math.cos(az) * Math.cos(el) * dist, Math.sin(el) * dist, Math.sin(az) * Math.cos(el) * dist), tgt: V() }; }

  }
  // overview distance fits the ring to the screen's narrower side; fog follows it so a phone is not fogged out

  }

    try { history.replaceState(null, '', location.pathname + location.search + (id ? '#' + id : '')); } catch (e) {}
  };
  function renderCrumb() {
    const c = $('#crumb'); c.innerHTML = '';
    const ids = focus ? trailOf(focus) : ['brain'];
    ids.forEach((id, i) => {
      if (i) html('span', { class: 'sep', text: '›', 'aria-hidden': 'true' }, c);
      const g = GI[id]; const b = html('button', { html: (g.layer === 1 ? `<span class="dot" style="background:${g.color}"></span>` : '') + esc(g.layer === 0 ? MAP.brain.name : g.name) }, c);
      if (i === ids.length - 1) b.setAttribute('aria-current', 'true');

  }

      if (lab.visible) { const k = dist * .932 / innerHeight, px = LABEL_PX[g.layer]; const h = clamp(LABEL_H[g.layer], k * px[0], k * px[1]) * lab.userData.ratio * labMul * (g === hoverG ? 1.12 : 1) / Math.max(.4, o.grp.scale.x); lab.scale.set(h * lab.userData.aspect, h, 1); }

    for (let i = 0; i < GL.length; i++) { const l = GL[i]; if (!l._mat || l.kind === 'out') continue; const s = GI[l.sId], tt = GI[l.tId]; const uf = l.kind === 'twig' ? lerp(.25, 1, clamp(s._u, 0, 1)) : 1; l._mat.opacity = LBASE[l.kind] * Math.min(s._dim, tt._dim) * uf * (Math.min(s._dim, tt._dim) < .99 ? .6 : 1); }
  }
  requestAnimationFrame(tick);

  /* entrance: start deep in space and drift in */
  setFocus(null);
  const home = camFor(null);
  cam.position.copy(home.pos.clone().multiplyScalar(REDUCED ? 1 : 2.6)).add(V(0, REDUCED ? 0 : 420, 0)); ctr.target.set(0, 0, 0); ctr.update();
