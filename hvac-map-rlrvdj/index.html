<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Joe's Heating and Air (demo): your AI shop map, HVAC Foundry</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --vio:#7c3aed; --ind:#4f46e5; --pk:#db2777; --pk-soft:#c4489f;
  --ink:#191627; --muted:#5f5a75; --muted2:#7d7793;
  --head:'Sora',system-ui,sans-serif; --body:'Plus Jakarta Sans',system-ui,sans-serif;
  /* dark stage */
  --stage:linear-gradient(160deg,#191430,#221a45 68%,#2b1f56);
  --txt:#ffffff; --txt2:#c9c2e4; --txt3:#8e86ad;
  --acc1:#8b9bff; --acc2:#ff8fd2; --acc3:#f0abfc; --acc4:#8b7bff;
  --live:#2fe39a; --warn:#ffc857; --assist:#5cc8ff;
  --glass:rgba(25,20,48,.72); --glass2:rgba(255,255,255,.06); --hair:rgba(255,255,255,.12);
  --panel-w:380px; --bar-h:60px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--body);color:var(--txt);background:#191430;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}
b,strong{font-weight:700}

/* stage layers (parallax) */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--stage)}
.bg{position:absolute;inset:-12%;pointer-events:none;will-change:transform}
.bg.glow{background:
  radial-gradient(900px 620px at 50% 48%,rgba(124,58,237,.40),transparent 62%),
  radial-gradient(700px 500px at 18% 20%,rgba(79,70,229,.30),transparent 60%),
  radial-gradient(760px 520px at 84% 80%,rgba(219,39,119,.22),transparent 60%)}
.bg.grid{background-image:radial-gradient(rgba(255,255,255,.11) 1px,transparent 1.2px);background-size:22px 22px;opacity:.55;
  -webkit-mask-image:radial-gradient(70% 70% at 50% 50%,#000 30%,transparent 100%);mask-image:radial-gradient(70% 70% at 50% 50%,#000 30%,transparent 100%)}
.bg.stars{background-image:
  radial-gradient(rgba(255,255,255,.55) .8px,transparent 1.2px),
  radial-gradient(rgba(240,171,252,.45) .8px,transparent 1.2px);
  background-size:230px 190px,310px 260px;background-position:30px 40px,120px 90px;opacity:.5}
#tilt{position:absolute;inset:0;transform-style:preserve-3d;perspective:1900px}
#tilt svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;transform:rotateX(4deg);transform-origin:50% 60%}
#tilt svg.grabbing{cursor:grabbing}

/* SVG world */
text{font-family:var(--body);user-select:none;pointer-events:none}
.fence{fill:none;stroke:rgba(255,255,255,.22);stroke-width:1.2;stroke-dasharray:3 9;stroke-linecap:round}
.fence-lbl{font-size:13px;letter-spacing:.14em;text-transform:uppercase;fill:rgba(255,255,255,.42);font-weight:600}
.edge{fill:none;stroke:rgba(255,255,255,.14);stroke-width:1.1;transition:stroke .25s,stroke-width .25s,opacity .3s}
.edge.twig{stroke:rgba(255,255,255,.17);stroke-width:1}
.edge.hub{stroke:rgba(139,155,255,.22);stroke-width:1.4}
.edge.spine{stroke:rgba(255,255,255,.10);stroke-width:2;stroke-dasharray:1 7;stroke-linecap:round}
.edge.on{stroke:var(--acc2);stroke-width:2.2;opacity:1}
.edge.on.two{stroke:var(--acc1)}
.focus .edge:not(.on){opacity:.22}
.node{cursor:pointer;transition:opacity .35s}
.focus .node:not(.on):not(.hub-g):not(.brain-g){opacity:.28}
.node .halo{opacity:0;transition:opacity .3s}
.node.st-live .halo{opacity:.9}
.node.on .halo,.node:hover .halo{opacity:1}
.node .core{stroke-width:1.5;transition:r .2s,stroke .2s}
.st-live .core{fill:url(#gLive);stroke:rgba(255,255,255,.75);filter:url(#softShadow)}
.st-available .core{fill:rgba(255,255,255,.08);stroke:rgba(139,155,255,.6);stroke-width:1.6}
.st-coming .core{fill:rgba(201,194,228,.22);stroke:rgba(255,255,255,.55);stroke-width:1;stroke-dasharray:2.5 2.5}
.node.on .core,.node:hover .core{stroke:#fff}
.st-coming{opacity:.9}
.st-coming .dotc{fill:rgba(255,255,255,.9)}
.st-coming .lbl{fill:var(--txt2);font-size:12.5px;font-weight:500}
.lbl{fill:var(--txt);font-size:13.5px;font-weight:600;paint-order:stroke;stroke:rgba(25,20,48,.75);stroke-width:4px;stroke-linejoin:round}
.st-available .lbl{fill:var(--txt2)}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;fill:var(--acc1)}
.tagbox{fill:rgba(139,155,255,.12);stroke:rgba(139,155,255,.45);stroke-width:1}
.chip{stroke:rgba(25,20,48,.9);stroke-width:1.5}
.chip.runs{fill:var(--live)}.chip.drafts{fill:var(--warn)}.chip.assists{fill:var(--assist)}
.pulse{fill:none;stroke:var(--live);stroke-width:1.5;opacity:0;transform-box:fill-box;transform-origin:center}
.st-live .pulse{animation:pulse 3.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.75}70%{transform:scale(1.9);opacity:0}100%{opacity:0}}
.hub-g .ring{fill:rgba(25,20,48,.7);stroke-width:2;filter:url(#softShadow)}
.hub-g .ring2{fill:none;stroke:rgba(255,255,255,.18);stroke-width:1;stroke-dasharray:2 6}
.hub-g .hl{fill:#fff;font-family:var(--head);font-weight:700;font-size:17.5px;letter-spacing:-.01em;paint-order:stroke;stroke:rgba(25,20,48,.8);stroke-width:5px;stroke-linejoin:round}
.hub-g .hs{fill:var(--txt2);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;paint-order:stroke;stroke:rgba(25,20,48,.8);stroke-width:4px;stroke-linejoin:round}
.hub-g .cnt{fill:var(--txt3);font-size:11px;text-anchor:middle;font-weight:600}
.hub-g .livecnt{fill:var(--live);font-size:11.5px;font-weight:700;letter-spacing:.06em}
.tag{dominant-baseline:central}
.brain-g .bcore{fill:url(#gBrain);stroke:rgba(255,255,255,.85);stroke-width:2;filter:url(#softShadow)}
.brain-g .bring{fill:none;stroke:rgba(255,255,255,.25);stroke-width:1}
.brain-g .bl{fill:#fff;font-family:var(--head);font-weight:800;font-size:24px;text-anchor:middle;letter-spacing:-.02em}
.brain-g .bs{fill:var(--txt2);font-size:11px;text-anchor:middle;font-weight:500;transition:opacity .4s}
.brain-g .spin{transform-box:fill-box;transform-origin:center;animation:spin 70s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stage-h{fill:#fff;font-family:var(--head);font-weight:700;font-size:15px;text-anchor:middle;letter-spacing:-.01em}
.stage-s{fill:var(--txt3);font-size:9.5px;text-anchor:middle;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.stage-n{fill:var(--acc1);font-size:10px;text-anchor:middle;font-weight:700;letter-spacing:.1em}
.branch-h{fill:var(--txt2);font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-anchor:end}
.jrn{transition:opacity .5s}
.lblg{transform-box:view-box;transform-origin:0 0}
.lod1 .st-coming .lblg{opacity:0}
.lod1 .st-coming:hover .lblg,.lod1 .st-coming.on .lblg{opacity:1}
.lod2 .st-available .lblg,.lod2 .st-coming .lblg{opacity:0}
.lod2 .st-available:hover .lblg,.lod2 .st-available.on .lblg{opacity:1}
.lblg,.node .lblg{transition:opacity .25s}

/* top bar */
#bar{height:var(--bar-h);display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--hair);z-index:5;position:relative}
.tenant{font-family:var(--head);font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap;display:flex;align-items:center;gap:9px}
.tenant .dot{width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 4px rgba(47,227,154,.18)}
.tenant small{font-weight:600;color:var(--txt3);font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-family:var(--body)}
.seg{display:flex;background:rgba(255,255,255,.07);border:1px solid var(--hair);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--txt2);padding:7px 14px;border-radius:999px;font-weight:600;font-size:13.5px;cursor:pointer;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:linear-gradient(100deg,var(--ind),var(--vio) 60%,var(--pk-soft));color:#fff;box-shadow:0 4px 16px rgba(124,58,237,.35)}
#search{position:relative;flex:1;max-width:420px;margin-left:auto}
#search input{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--hair);color:#fff;border-radius:999px;padding:9px 14px 9px 38px;font-size:14px;outline:none;transition:border .2s,background .2s}
#search input::placeholder{color:var(--txt3)}
#search input:focus{border-color:rgba(139,155,255,.7);background:rgba(255,255,255,.1)}
#search .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;opacity:.6}
#hits{position:absolute;top:calc(100% + 8px);left:0;right:0;background:rgba(25,20,48,.96);border:1px solid var(--hair);border-radius:14px;overflow:hidden;display:none;box-shadow:0 20px 50px rgba(0,0,0,.45)}
#hits.show{display:block}
#hits button{display:flex;width:100%;text-align:left;border:0;background:transparent;color:#fff;padding:10px 14px;cursor:pointer;gap:10px;align-items:center;font-size:13.5px}
#hits button:hover,#hits button.k{background:rgba(255,255,255,.08)}
#hits .fc{color:var(--acc3);font-weight:600}
#hits .d{color:var(--txt3);margin-left:auto;font-size:12px;white-space:nowrap}
.product{font-family:var(--head);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt2);white-space:nowrap;display:flex;align-items:center;gap:8px}
.product i{display:inline-block;width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,var(--ind),var(--vio) 55%,var(--pk))}

/* main */
#main{flex:1;display:flex;min-height:0}
#panel{width:var(--panel-w);flex:none;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-left:1px solid var(--hair);transform:translateX(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);overflow:auto;display:flex;flex-direction:column;z-index:4;margin-right:calc(var(--panel-w) * -1)}
#panel.open{transform:none;margin-right:0}
.ph{padding:18px 20px 12px;border-bottom:1px solid var(--hair);position:sticky;top:0;background:rgba(25,20,48,.85);backdrop-filter:blur(10px);z-index:1}
.ph .crumb{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--txt3);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.ph .crumb .dp{width:8px;height:8px;border-radius:50%}
.ph h2{font-family:var(--head);font-size:21px;margin:8px 0 4px;letter-spacing:-.02em;line-height:1.2}
.ph .fc{color:var(--acc3);font-weight:600;font-size:14px}
.ph .fc:before{content:'“'}.ph .fc:after{content:'”'}
.x{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--hair);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;font-size:18px;line-height:1}
.x:hover{background:rgba(255,255,255,.14)}
.pb{padding:16px 20px 28px;display:flex;flex-direction:column;gap:14px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--hair);background:rgba(255,255,255,.06);color:var(--txt2)}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block}
.pill.live{border-color:rgba(47,227,154,.5);color:var(--live)}
.pill.available{border-color:rgba(139,155,255,.55);color:var(--acc1)}
.pill.coming{border-style:dashed;color:var(--txt3)}
.pill.demo{background:rgba(255,200,87,.1);border-color:rgba(255,200,87,.45);color:var(--warn)}
.job{font-size:15px;line-height:1.5;color:#fff}
.pain{border-left:3px solid var(--acc2);padding:8px 12px;color:var(--txt2);font-size:14px;line-height:1.5;background:rgba(255,143,210,.06);border-radius:0 10px 10px 0;font-style:italic}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.06);padding:4px;border-radius:12px;border:1px solid var(--hair)}
.tabs button{flex:1;border:0;background:transparent;color:var(--txt2);padding:8px 6px;border-radius:9px;font-weight:600;font-size:13px;cursor:pointer}
.tabs button[aria-selected="true"]{background:rgba(255,255,255,.12);color:#fff}
.card{background:rgba(255,255,255,.05);border:1px solid var(--hair);border-radius:14px;padding:14px}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 14px;font-size:13.5px}
.kv dt{color:var(--txt3)}.kv dd{margin:0;color:#fff;font-weight:600;text-align:right}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(255,255,255,.05);border:1px solid var(--hair);border-radius:12px;padding:12px 10px;text-align:center}
.stat b{display:block;font-family:var(--head);font-size:22px;letter-spacing:-.02em;background:linear-gradient(90deg,var(--acc1),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:11px;color:var(--txt3);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.spark{display:flex;align-items:flex-end;gap:4px;height:46px;margin-top:8px}
.spark i{flex:1;background:linear-gradient(180deg,var(--acc4),rgba(139,123,255,.25));border-radius:3px 3px 0 0;min-height:4px}
.acts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.acts li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:13.5px;line-height:1.4}
.acts li:last-child{border:0}
.acts time{color:var(--txt3);font-size:12px;white-space:nowrap;min-width:58px;padding-top:2px;font-variant-numeric:tabular-nums}
.acts .ok{width:8px;height:8px;border-radius:50%;background:var(--live);flex:none;margin-top:6px}
.acts .wait{background:var(--warn)}
.video{aspect-ratio:16/9;border-radius:14px;background:linear-gradient(150deg,rgba(79,70,229,.45),rgba(219,39,119,.35)),rgba(255,255,255,.04);border:1px solid var(--hair);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#fff;position:relative;overflow:hidden}
.video:after{content:'';position:absolute;inset:0;background:radial-gradient(60% 60% at 50% 50%,rgba(255,255,255,.08),transparent)}
.video .play{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);display:grid;place-items:center}
.video .play:before{content:'';border-left:18px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:4px}
.video small{font-size:12px;color:var(--txt2);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.btns{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:12px;padding:13px 14px;font-weight:700;font-size:14px;cursor:pointer;text-align:center;text-decoration:none;color:#fff;display:block}
.btn.p{background:linear-gradient(100deg,var(--ind),var(--vio) 60%,var(--pk-soft));box-shadow:0 8px 24px rgba(124,58,237,.35)}
.btn.s{background:rgba(255,255,255,.08);border:1px solid var(--hair)}
.note{font-size:12.5px;color:var(--txt3);line-height:1.5;text-align:center}
.grade-l{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--txt2)}
.grade-l i{width:10px;height:10px;border-radius:50%}
.dlist{display:flex;flex-direction:column;gap:6px}
.dlist button{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border:1px solid var(--hair);border-radius:10px;padding:9px 12px;color:#fff;cursor:pointer;font-size:13.5px;text-align:left}
.dlist button:hover{background:rgba(255,255,255,.1)}
.dlist .st{width:9px;height:9px;border-radius:50%;flex:none}
.dlist .st.live{background:var(--live);box-shadow:0 0 0 3px rgba(47,227,154,.2)}
.dlist .st.available{background:transparent;border:1.5px solid var(--acc1)}
.dlist .st.coming{background:transparent;border:1px dashed var(--txt3)}
.dlist .g{margin-left:auto;font-size:11px;color:var(--txt3);font-weight:600}

/* overlays */
.ov{position:absolute;z-index:3;pointer-events:none}
#legend{right:18px;bottom:18px;background:var(--glass);border:1px solid var(--hair);border-radius:14px;padding:12px 14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:grid;grid-template-columns:auto auto;gap:7px 22px;font-size:12.5px;color:var(--txt2);pointer-events:auto}
#legend h4{grid-column:1/-1;margin:0 0 2px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt3);font-weight:700}
#legend .l{display:flex;align-items:center;gap:9px;white-space:nowrap}
#legend .sw{width:14px;height:14px;border-radius:50%;flex:none}
#legend .sw.live{background:radial-gradient(circle at 40% 35%,#fff,var(--acc1) 35%,var(--vio));box-shadow:0 0 0 3px rgba(139,155,255,.25),0 0 14px rgba(124,58,237,.8)}
#legend .sw.available{border:1.5px solid var(--acc1);background:rgba(255,255,255,.08)}
#legend .sw.coming{border:1px dashed var(--txt3)}
#legend .sw.runs{background:var(--live);width:10px;height:10px;margin:0 2px}
#legend .sw.drafts{background:var(--warn);width:10px;height:10px;margin:0 2px}
#legend .sw.assists{background:var(--assist);width:10px;height:10px;margin:0 2px}
#ctl{right:18px;bottom:148px;display:flex;flex-direction:column;gap:6px;pointer-events:auto}
#ctl button{width:36px;height:36px;border-radius:10px;border:1px solid var(--hair);background:var(--glass);color:#fff;cursor:pointer;font-size:17px;backdrop-filter:blur(10px)}
#ctl button:hover{background:rgba(255,255,255,.14)}
#wm{left:18px;bottom:18px;display:flex;align-items:center;gap:10px}
.wordmark{font-family:var(--head);font-weight:800;letter-spacing:-.03em;font-size:17px;color:#fff}
.wordmark b{background:linear-gradient(90deg,#8b7bff,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent}
#wm small{font-size:11px;color:var(--txt3);font-weight:600;letter-spacing:.08em;text-transform:uppercase;border-left:1px solid var(--hair);padding-left:10px}
#hint{left:18px;top:14px;font-size:12.5px;color:var(--txt3);font-weight:500;background:rgba(25,20,48,.5);padding:6px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.06);transition:opacity .6s}
#hint.off{opacity:0}
#demo{left:50%;top:14px;transform:translateX(-50%);font-size:11px;color:var(--warn);font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:rgba(255,200,87,.09);border:1px solid rgba(255,200,87,.35);padding:5px 12px;border-radius:999px}

/* phone */
@media (max-width:760px){
  :root{--bar-h:auto}
  #bar{flex-wrap:wrap;padding:10px 12px;gap:10px}
  .tenant{font-size:14px;flex:1}
  .tenant small{display:none}
  .product{display:none}
  .seg{order:3}
  .seg button{padding:6px 11px;font-size:12.5px}
  #search{order:4;flex:1;max-width:none;margin-left:0}
  #main{flex-direction:column}
  #panel{width:100%;margin-right:0;transform:none;height:0;overflow:hidden;border-left:0;border-top:1px solid var(--hair);transition:height .38s cubic-bezier(.2,.8,.2,1);flex:none}
  #panel.open{height:46%;overflow:auto}
  #stage{min-height:0}
  #legend{right:10px;bottom:10px;padding:8px 10px;gap:5px 12px;font-size:11px}
  #legend h4{display:none}
  .panel-open #legend{display:none}
  #ctl{display:none}
  #wm{left:10px;bottom:10px}
  #wm small{display:none}
  #hint{display:none}
  #demo{top:8px}
  #tilt svg{transform:none}
  .hub-g .hl{font-size:14px}.hub-g .hs{font-size:9.5px}.lbl{font-size:12px}
  .stats{grid-template-columns:repeat(3,1fr)}
}
@media (prefers-reduced-motion:reduce){
  .st-live .pulse,.brain-g .spin{animation:none}
  .st-live .pulse{opacity:.35;transform:scale(1.3)}
  #panel,.edge,.node{transition:none}
}
</style>
</head>
<body>
<div id="app">
  <header id="bar">

  const s = html('div', { class: 'stats' }, body); [[c.live, 'live'], [c.available, 'to add'], [c.coming, 'on the list']].forEach(([v, l]) => { const t = html('div', { class: 'stat' }, s); html('b', { text: v }, t); html('span', { text: l }, t); });
  const list = html('div', { class: 'dlist' }, body);
  ['live', 'available', 'coming'].forEach(st => d.nodes.filter(n => n.state === st).forEach(n => { const b = html('button', { html: `<span class="st ${st}"></span>${esc(n.label)}${n.grade ? `<span class="g">${esc(GR[n.grade][1])}</span>` : ''}` }, list); b.onclick = () => { select(n.id); centerOn(n); }; }));
}
function renderBrain() {
  const head = html('div', { class: 'ph' }, panel);
  html('div', { class: 'crumb', text: 'The center of your map' }, head); html('h2', { text: MAP.brain.name }, head); html('div', { class: 'fc', style: 'font-style:normal', text: MAP.brain.subtitle }, head);
  html('button', { class: 'x', 'aria-label': 'Close', text: '×' }, head).onclick = deselect;
  const body = html('div', { class: 'pb' }, panel);
  html('p', { class: 'job', text: 'Every agent reads the same facts: your hours, service area, prices you allow it to say, scripts, on-call rota and the rules it must never break. Change a fact once and every department picks it up.' }, body);
  const c = html('div', { class: 'card' }, body); const dl = html('dl', { class: 'kv' }, c);
  [['Shop', MAP.tenant.name + ' (demo)'], ['Departments connected', String(D.length)], ['Agents live', String(N.filter(n => n.state === 'live').length)], ['Available to add', String(N.filter(n => n.state === 'available').length)], ['On the build list', String(N.filter(n => n.state === 'coming').length)], ['Fence', MAP.fence.items.join(', ')]].forEach(([k, v]) => { html('dt', { text: k }, dl); html('dd', { text: v }, dl); });
}

/* ---------- search ---------- */
const q = $('#q'), hits = $('#hits'); let hitIdx = 0;
const searchable = [...N.map(n => ({ id: n.id, label: n.label, fc: n.fastcontext || '', dept: DI[n.dept].label, hay: (n.label + ' ' + (n.fastcontext || '') + ' ' + n.name + ' ' + (n.slug || '')).toLowerCase() })), ...HUBS.map(h => ({ id: h.id, label: h.d.label, fc: h.d.name, dept: h.id, hay: (h.d.label + ' ' + h.d.name).toLowerCase() })), { id: 'brain', label: MAP.brain.name, fc: MAP.brain.subtitle, dept: '', hay: 'shop brain ' + MAP.brain.subtitle }];
function doSearch() { const v = q.value.trim().toLowerCase(); hits.innerHTML = ''; if (!v) { hits.classList.remove('show'); return; } const terms = v.split(/\s+/); const m = searchable.filter(s => terms.every(t => s.hay.includes(t))).slice(0, 7); if (!m.length) { hits.classList.remove('show'); return; } hitIdx = 0; m.forEach((s, i) => { const b = html('button', { html: `${esc(s.label)} ${s.fc ? `<span class="fc">${esc(s.fc)}</span>` : ''}<span class="d">${esc(s.dept)}</span>`, class: i === 0 ? 'k' : '' }, hits); b.onclick = () => pick(s.id); }); hits.classList.add('show'); }
function pick(id) { hits.classList.remove('show'); q.blur(); if (view === 'jrn' && NI[id] && NI[id].state === 'coming') setView('dept', true); select(id); if (!HI[id]) centerOn(P(id), Math.max(cam.k, 1.3)); }
q.addEventListener('input', doSearch);
q.addEventListener('keydown', e => { const bs = [...hits.children]; if (!bs.length) return; if (e.key === 'ArrowDown') { hitIdx = (hitIdx + 1) % bs.length; } else if (e.key === 'ArrowUp') { hitIdx = (hitIdx - 1 + bs.length) % bs.length; } else if (e.key === 'Enter') { bs[hitIdx].click(); return; } else return; bs.forEach((b, i) => b.classList.toggle('k', i === hitIdx)); e.preventDefault(); });
document.addEventListener('click', e => { if (!e.target.closest('#search')) hits.classList.remove('show'); });

/* ---------- boot ---------- */
$('#tenantName').textContent = MAP.tenant.name;
setView('dept', false);
requestAnimationFrame(frame);
addEventListener('resize', () => fitAll(false));
setTimeout(() => $('#hint').classList.add('off'), 9000);
window.__map = { select, setView, fitAll, N, cam: () => cam };
